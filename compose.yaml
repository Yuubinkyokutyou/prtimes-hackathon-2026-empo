name: team-empo-local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-team_empo}
      POSTGRES_USER: ${POSTGRES_USER:-team_empo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    restart: "no"
    command: ["npm", "run", "migrate", "-w", "backend"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-team_empo}:${POSTGRES_PASSWORD:-local_password}@db:5432/${POSTGRES_DB:-team_empo}
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-team_empo}:${POSTGRES_PASSWORD:-local_password}@db:5432/${POSTGRES_DB:-team_empo}
      DATABASE_SSL: "false"
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-300000}
      RECOMMENDATION_DATA_SOURCE: ${RECOMMENDATION_DATA_SOURCE:-production_subset}
      PRODUCTION_SUBSET_DIRECTORY: /app/database/production_subset/csv
      RECOMMENDATION_STALE_AFTER_DAYS: ${RECOMMENDATION_STALE_AFTER_DAYS:-60}
      RECOMMENDATION_STORAGE_ENABLED: ${RECOMMENDATION_STORAGE_ENABLED:-true}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./backend/src:/app/backend/src
      - ./database/production_subset/csv:/app/database/production_subset/csv:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
